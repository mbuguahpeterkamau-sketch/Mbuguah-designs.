<!DOCTYPE html>
<html>
<head>
<title>Portfolio</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="menu-btn" onclick="toggle()">☰</div>

<div class="sidebar" id="sidebar">
<div class="logo-box">
<img src="logo1.png">
<span>Mbuguah Designs</span>
</div>

<a href="index.html">Home</a>
<a href="portfolio.html">Portfolio</a>
<a href="order.html">Order</a>
<a href="contact.html">Contact</a>
<a href="dashboard.html">Dashboard</a>
</div>

<div class="main">
<h2>Portfolio</h2>

<div class="gallery">
<div class="item"><img src="logo1.png" onclick="openImg(this)"></div>
<div class="item"><img src="poster1.png" onclick="openImg(this)"></div>
<div class="item"><img src="design1.jpg" onclick="openImg(this)"></div>
<div class="item"><img src="design2.jpg" onclick="openImg(this)"></div>
</div>
</div>

<div id="lightbox" onclick="closeImg()">
<img id="lightbox-img">
</div>

<script>
function toggle(){document.getElementById("sidebar").classList.toggle("active");}

function openImg(img){
document.getElementById("lightbox").style.display="flex";
document.getElementById("lightbox-img").src=img.src;
}

function closeImg(){
document.getElementById("lightbox").style.display="none";
}
</script>

</body>
</html>
